# Pricing Data Quality Monitor: settings
# Every threshold the checks use lives here, so a reviewer can see and change them in one place.

[universe]
# Large caps across sectors. Add or remove tickers freely.
symbols = [
  "AAPL", "MSFT", "NVDA", "AMZN", "GOOGL", "META", "JPM", "BAC", "GS", "V",
  "JNJ", "UNH", "PFE", "XOM", "CVX", "PG", "KO", "PEP", "WMT", "HD",
  "CAT", "BA", "GE", "DIS", "NFLX", "INTC", "CSCO", "ORCL", "T", "VZ",
]
start = "2023-01-01"   # history used for rolling statistics

[equity]
stale_min_repeats = 3       # same close on this many days in a row after the first = stale
coverage = 0.8              # a date counts as a trading day when >= 80% of symbols report it
z_window = 60               # trading days in the rolling robust z-score
z_min_periods = 20
z_threshold = 6.0           # robust z-score (median / MAD) on market-adjusted log returns
split_ratios = [2, 3, 4, 5, 10, 1.5]
split_tol = 0.03            # price ratio within 3% of a split ratio
revert_tol = 0.35           # a move and the next day's move cancel within 35% = spike that reverted
xsrc_ratio_tol = 0.02       # primary/secondary close ratio jumps > 2% in a day = cross-source break

[rates]
min_yield = -1.0
max_yield = 25.0
jump_abs_bp = 40.0          # any one-day move above 40 bp is flagged
jump_z = 6.0                # or a robust z-score above 6 on daily changes
z_window = 60
z_min_periods = 20
kink_bp = 20.0              # tenor departs from the line between its neighbours by 20 bp more than usual
kink_window = 60
xsrc_tol_bp = 2.0           # Treasury vs FRED for the same tenor and date
tenor_coverage = 0.9        # a tenor is expected on a date when it was published on >= 90% of dates
