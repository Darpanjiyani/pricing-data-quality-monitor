name: daily-data-quality

on:
  schedule:
    - cron: "30 23 * * 1-5"   # weekdays 23:30 UTC, after the Treasury curve and US closes are out
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q

  daily:
    needs: test
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[live]"
      - name: Fetch, check and score
        run: pdq daily --with-eval
      - uses: actions/upload-artifact@v4
        with:
          name: data-quality-report-${{ github.run_id }}
          path: reports/
